<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ending Sounds Match — English K · Learning By Grace</title>
<style>
  :root{ --blue:#3D49A0; --gold:#C9A24B; --cream:#FBF6EC; --ink:#2A2740; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Trebuchet MS','Segoe UI',sans-serif;background:
    radial-gradient(circle at 30% 10%, #5b67c4 0%, var(--blue) 55%, #2c357a 100%);
    color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;}
  .kick{color:var(--gold);font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-size:.8rem;}
  h1{color:#fff;margin:.2rem 0 0;text-align:center;font-size:1.5rem;}
  .sub{color:#e7e9ff;margin:.2rem 0 1rem;text-align:center;font-size:.95rem;}
  .card{background:var(--cream);border-radius:20px;padding:22px;max-width:680px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);}
  .prompt{text-align:center;margin-bottom:6px;}
  .promptword{font-size:2.6rem;font-weight:bold;color:var(--blue);line-height:1;}
  .promptword .end{color:var(--gold);text-decoration:underline;}
  .listen{background:var(--gold);border:none;color:#2a2740;font-weight:bold;font-size:1.05rem;
    padding:12px 22px;border-radius:30px;cursor:pointer;margin-top:10px;box-shadow:0 3px 0 #a9842f;}
  .listen:active{transform:translateY(2px);box-shadow:0 1px 0 #a9842f;}
  .ask{text-align:center;color:var(--ink);font-size:1.1rem;margin:14px 0;font-weight:bold;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .pick{background:#fff;border:4px solid #e4ddc8;border-radius:16px;padding:8px;cursor:pointer;
    transition:transform .1s,border-color .15s;text-align:center;}
  .pick:hover{transform:translateY(-3px);}
  .pick img{width:100%;height:120px;object-fit:contain;border-radius:10px;}
  .pick .lbl{font-weight:bold;color:var(--ink);margin-top:4px;font-size:.95rem;}
  .pick .lbl .end{color:var(--gold);text-decoration:underline;}
  .pick.correct{border-color:#3fae5a;background:#e8f8ec;}
  .pick.wrong{border-color:#d9534f;background:#fdeaea;animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .score{text-align:center;margin-top:14px;color:var(--blue);font-weight:bold;}
  .msg{text-align:center;min-height:26px;font-weight:bold;font-size:1.1rem;margin-top:8px;}
  .next{background:var(--blue);color:#fff;border:none;padding:10px 26px;border-radius:30px;
    font-weight:bold;font-size:1rem;cursor:pointer;display:none;margin:8px auto 0;}
  .brandfooter{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;
    color:#e7e9ff;font-size:.72rem;text-align:center;}
  .brandfooter img{height:26px;}
</style>
</head>
<body>
  <div class="kick">English K · Phonemic Awareness</div>
  <h1>Ending Sounds Match</h1>
  <div class="sub">Listen to the word. Tap the picture that <b>ends</b> with the same sound!</div>

  <div class="card">
    <div class="prompt">
      <div class="promptword" id="promptword">cat</div>
      <button class="listen" onclick="sayPrompt()">🔊 Hear the word</button>
    </div>
    <div class="ask" id="ask">Which picture ends with the same sound?</div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg"></div>
    <button class="next" id="next" onclick="nextRound()">Next ▶</button>
    <div class="score" id="score">Score: 0 / 0</div>
  </div>

  <div class="brandfooter">
    <img src="https://base44.app/api/apps/6a1efd8efa1513ab48247266/files/mp/public/6a1efd8efa1513ab48247266/85bbcae99_lbg_logo_small.png" alt="Learning By Grace">
    A Learning By Grace production · © 2026 Learning By Grace · All rights reserved.
  </div>

<script>
// end = final phoneme/letter; endsound = how to say it aloud
const BANK = [
  {word:"cat", end:"t", endsound:"t",  img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/cfb89c4bb_generated_image.png"},
  {word:"dog", end:"g", endsound:"g",  img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/9929261fb_generated_image.png"},
  {word:"sun", end:"n", endsound:"nnn",img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/96d95aaf8_generated_image.png"},
  {word:"bed", end:"d", endsound:"d",  img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/312a0d663_generated_image.png"},
  {word:"pig", end:"g", endsound:"g",  img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/069dcb59e_generated_image.png"},
  {word:"cap", end:"p", endsound:"p",  img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/2dfacf4d7_generated_image.png"},
  {word:"pen", end:"n", endsound:"nnn",img:"https://media.base44.com/images/public/6a1efd8efa1513ab48247266/fd8028baa_generated_image.png"},
];
let target, options, score=0, rounds=0, answered=false;

function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);}
function labelHtml(w){ return w.slice(0,-1)+'<span class="end">'+w.slice(-1)+'</span>'; }

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.85; u.pitch=1.1; u.lang="en-US";
  speechSynthesis.speak(u);
}
function sayPrompt(){ speak(`${target.word}. ${target.word} ends with ${target.endsound}.`); }

function newRound(){
  answered=false;
  document.getElementById('msg').textContent="";
  document.getElementById('next').style.display="none";
  const pool=shuffle(BANK);
  target=pool[0];
  // pick a distractor that ends DIFFERENTLY, plus one matching end if available
  const sameEnd = pool.find((p,i)=> i>0 && p.end===target.end);
  let opts=[target];
  if(sameEnd){ opts.push(sameEnd); }
  for(const p of pool){ if(opts.length>=3) break; if(!opts.includes(p) && p.end!==target.end) opts.push(p); }
  // ensure exactly one is "correct" matching target end: target itself is the answer
  options=shuffle(opts.slice(0,3));
  document.getElementById('promptword').innerHTML=labelHtml(target.word);
  document.getElementById('ask').textContent=`Which picture ends with the "${target.end}" sound?`;
  const grid=document.getElementById('grid');
  grid.innerHTML="";
  options.forEach(o=>{
    const d=document.createElement('div');
    d.className="pick";
    d.innerHTML=`<img src="${o.img}" alt="${o.word}"><div class="lbl">${labelHtml(o.word)}</div>`;
    d.onclick=()=>choose(o,d);
    grid.appendChild(d);
  });
  setTimeout(sayPrompt,350);
}
function choose(o,el){
  if(answered) return;
  answered=true; rounds++;
  // correct = same ending as target (and not the target picture itself when a sameEnd twin exists)
  const isCorrect = (o.end===target.end);
  if(isCorrect){
    el.classList.add('correct'); score++;
    document.getElementById('msg').style.color="#3fae5a";
    document.getElementById('msg').textContent=`Yes! ${o.word.toUpperCase()} ends with ${target.end}. 🎉`;
    speak(`Yes! ${o.word} ends with ${target.endsound}.`);
  }else{
    el.classList.add('wrong');
    document.getElementById('msg').style.color="#d9534f";
    document.getElementById('msg').textContent=`Listen again for the ${target.end} ending.`;
    speak(`${o.word} ends with ${o.endsound}. We want ${target.endsound}.`);
    document.querySelectorAll('.pick').forEach((p,i)=>{ if(options[i].end===target.end) p.classList.add('correct'); });
  }
  document.getElementById('score').textContent=`Score: ${score} / ${rounds}`;
  document.getElementById('next').style.display="inline-block";
}
function nextRound(){ newRound(); }
newRound();
</script>
</body>
</html>
