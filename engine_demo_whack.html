<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>🔨 Whack-the-Word</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{margin:0;background:#F5F6FB;color:#3D49A0;padding:18px}
.wrap{max-width:680px;margin:0 auto;background:#fff;border:3px solid #A9B2E0;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(61,73,160,.15)}
.hd{background:linear-gradient(135deg,#4F5DB0,#3D49A0);color:#fff;padding:16px 20px}
.hd h1{margin:0;font-size:22px}.hd p{margin:4px 0 0;opacity:.9;font-size:14px}
.bd{padding:22px}
.score{font-weight:700;color:#3D49A0;margin-bottom:12px}
.btn{background:#4F5DB0;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#3D49A0}
.tile{display:inline-flex;align-items:center;justify-content:center;background:#F5F6FB;border:2px solid #A9B2E0;border-radius:12px;font-weight:800;cursor:pointer;user-select:none;transition:.12s}
.tile:hover{border-color:#4F5DB0;transform:translateY(-2px)}
.good{background:#3aa657!important;color:#fff!important;border-color:#3aa657!important}
.bad{background:#d9534f!important;color:#fff!important;border-color:#d9534f!important}
.banner{margin-top:18px;text-align:center}
.banner a{display:inline-block;background:#3D49A0;color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:12px}
.verse{margin-top:14px;font-style:italic;color:#4F5DB0;text-align:center;font-size:14px}
</style></head><body><div class=wrap>
<div class=hd><h1>🔨 Whack-the-Word</h1><p>Tap the target word every time it pops up!</p></div>
<div class=bd><div class=score id=score>Score: 0</div><div id=game></div>
<div class=verse>"Let the wise listen and add to their learning." — Proverbs 1:5</div>
<div class=banner><a href="https://docs.google.com/forms/d/e/1FAIpQLSempv0GyGaMueoDkb4aLNtsnbai_XNLePnFKbfef1dygab0mw/viewform" target=_blank>📬 SUBMIT YOUR WORK HERE</a></div>
</div></div>
<script>let score=0;const sc=document.getElementById('score');function add(n){score+=n;sc.textContent='Score: '+score}

const target='cat';const pool=['cat','dog','sun','cat','hat','cat','pig','cat'];
const g=document.getElementById('game');
g.innerHTML='<p>Tap every <b>'+target.toUpperCase()+'</b> you see! Watch them pop up.</p><div id=field style="position:relative;height:280px;background:#F5F6FB;border:2px dashed #A9B2E0;border-radius:14px;overflow:hidden"></div>';
const field=document.getElementById('field');let hits=0,total=0;
function pop(){const w=pool[Math.floor(Math.random()*pool.length)];const b=document.createElement('div');b.className='tile';b.textContent=w.toUpperCase();b.style.cssText+='position:absolute;height:46px;padding:0 14px;font-size:18px';b.style.left=(Math.random()*78)+'%';b.style.top=(Math.random()*72)+'%';b.onclick=()=>{if(w===target){b.classList.add('good');add(5);hits++;}else{b.classList.add('bad');}setTimeout(()=>b.remove(),300);};field.appendChild(b);total++;setTimeout(()=>b.remove(),1600);}
const iv=setInterval(pop,700);setTimeout(()=>{clearInterval(iv);setTimeout(()=>{field.innerHTML='<p style=\'padding:20px;font-weight:800;color:#3D49A0\'>⏰ Time! You whacked '+hits+' '+target.toUpperCase()+'s. Score: '+score+'</p>';},1700);},12000);
</script></body></html>
